<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>يوم جديد في السعودية</title>
  <meta name="description" content="موجز يومي هادئ لما يحدث في المملكة: إنجازات ومؤشرات وخدمات، في شاشة واحدة ودقيقة قراءة.">
  <meta name="theme-color" content="#0b5d3b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5d3b'/%3E%3Ccircle cx='16' cy='18' r='7' fill='%23f7f5f0'/%3E%3Crect x='6' y='23' width='20' height='4' fill='%230b5d3b'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/thmanyahserifdisplay-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css?v=0.74">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="m-title"><p class="site-title">يـومٌ جـديد في السـُعـوديَّـة</p></div>
    </header>

    <section class="lead">
      <p class="eyebrow" id="edition-label" hidden></p>
      <h1 id="headline">…</h1>
      <div class="also" id="more-wrap" hidden>
        <span class="also-label">وأيضًا</span>
        <ul class="more" id="more" aria-label="أخبار أخرى"></ul>
      </div>
      <p class="hint">اضغط على العبارات الملوّنة للتفاصيل والمصدر.</p>
    </section>


    <dialog class="detail" id="detail" aria-labelledby="d-title">
      <div class="d-meta">
        <span class="cat" id="d-cat"></span>
        <time id="d-date"></time>
        <button type="button" class="d-close" id="d-close" aria-label="إغلاق">✕</button>
      </div>
      <h3 id="d-title"></h3>
      <p id="d-summary"></p>
      <a class="d-source" id="d-source" target="_blank" rel="noopener">
        <span>المصدر: <span id="d-source-name"></span></span><span aria-hidden="true">↖</span>
      </a>
    </dialog>

    <!-- Riyadh is fixed in the first column; the second column stacks two cities the reader picks -->
    <section class="regions" id="regions-wrap" aria-label="فعاليات المدن" hidden>
      <div class="region r-main"><div class="r-pick r-fixed"><span class="r-icon" id="ic-0"></span><span class="r-name" id="nm-0"></span><span class="r-weather" id="w-0"></span></div><ul id="r-0"></ul></div>
      <div class="r-stack">
        <div class="region"><label class="r-pick"><span class="r-icon" id="ic-1"></span><span class="r-name" id="nm-1" aria-hidden="true"></span><span class="r-weather" id="w-1"></span><span class="sr-only">اختر المدينة</span><select id="pick-1"></select></label><ul id="r-1"></ul></div>
        <div class="region"><label class="r-pick"><span class="r-icon" id="ic-2"></span><span class="r-name" id="nm-2" aria-hidden="true"></span><span class="r-weather" id="w-2"></span><span class="sr-only">اختر المدينة</span><select id="pick-2"></select></label><ul id="r-2"></ul></div>
      </div>
    </section>

    <section class="events" id="events-wrap" hidden>
      <h2>قادم</h2>
      <ul id="events"></ul>
    </section>

    <!-- The date tile sits at the top-left; the day timeline flows down from it -->
    <div class="tile swap cal-src" id="date-tile" role="img">
      <div class="face greg" aria-hidden="true" lang="en" dir="ltr"><span class="m" id="greg-m"></span><span class="d" id="greg-d"></span><span class="mo" id="greg-mo"></span></div>
      <div class="face hijri" aria-hidden="true"><span class="m" id="hijri-m"></span><span class="d" id="hijri-d"></span><span class="mo" id="hijri-mo"></span></div>
    </div>
    <section class="timeline" id="timeline" aria-label="اليوم" hidden>
      <div class="tl-track" id="tl-track"><span class="tl-line"></span></div>
    </section>

    <footer class="foot">
      <p>كل خبر مؤرخ ومربوط بمصدره. نلخّص ونحيل إلى المصدر، ولا نعيد نشر المقالات.</p>
      <p class="ver">الإصدار v0.74 · 2026-10-16</p>
      <p id="pilot-note" hidden>نسخة تجريبية تُحرَّر يدويًا.</p>
    </footer>
  </main>

  <script src="assets/adhan.min.js"></script>
  <script src="assets/app.js?v=0.74"></script>
</body>
</html>
